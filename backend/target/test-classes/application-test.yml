spring:
  datasource:
    url: jdbc:h2:mem:finbuddy_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

finbuddy:
  storage:
    s3:
      endpoint: http://localhost:9000
      bucket-name: test-bucket
  audit:
    hmac-secret: test-secret-key-1234567890-test-secret
