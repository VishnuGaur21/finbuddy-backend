spring:
  # In-memory H2 Database operating in PostgreSQL compatibility mode
  datasource:
    url: jdbc:h2:mem:finbuddy_crm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: FinbuddyLocalH2Pool
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  # Flyway disabled for in-memory H2 (Hibernate automatically generates schema)
  flyway:
    enabled: false

  # Redis repositories disabled for local standalone mode
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.finbuddy.crm: INFO
    org.springframework.security: WARN
