version: '3.8'

services:
  # Primary PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: finbuddy-postgres
    environment:
      POSTGRES_DB: finbuddy_crm
      POSTGRES_USER: finbuddy_user
      POSTGRES_PASSWORD: finbuddy_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbuddy_user -d finbuddy_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: finbuddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: finbuddy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Create MinIO Storage Bucket automatically
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/finbuddy-crm-storage --ignore-existing;
      exit 0;
      "

  # Keycloak OIDC / OAuth 2.0 Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: finbuddy-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --http-port 8180
    ports:
      - "8180:8180"

  # Finbuddy CRM Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finbuddy-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finbuddy_crm
      SPRING_DATASOURCE_USERNAME: finbuddy_user
      SPRING_DATASOURCE_PASSWORD: finbuddy_secure_pwd
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: finbuddy-crm-storage
      OIDC_ISSUER_URI: http://keycloak:8180/realms/finbuddy
      OIDC_JWK_SET_URI: http://keycloak:8180/realms/finbuddy/protocol/openid-connect/certs
      AUDIT_HMAC_SECRET: finbuddy-crypto-tamper-evident-chain-secret-key-2026

volumes:
  postgres_data:
  redis_data:
  minio_data:
